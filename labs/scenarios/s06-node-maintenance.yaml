id: s06-node-maintenance
title: "Node maintenance window"
level: scenario
minutes: 15
tracks: [cka, ckad]
topic: Real-life scenarios
intro: |
  `node01` needs a kernel patch and a reboot tonight. Before the reboot,
  every workload must move off it without an outage; after the patch, the
  node goes back into service.

  On the node right now: Pods of the Deployment `web` (4 replicas, with a
  PodDisruptionBudget that keeps 3 available), the DaemonSet Pods of
  `node-exporter`, and a leftover test Pod `scratch` that nobody owns and
  that can be thrown away.
setup:
  - kubectl create deployment web --image=nginx:1.29 --replicas=4
  - kubectl create pdb web --selector=app=web --min-available=3
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: node-exporter
    spec:
      selector:
        matchLabels:
          app: node-exporter
      template:
        metadata:
          labels:
            app: node-exporter
        spec:
          containers:
          - name: exporter
            image: busybox:1.36
            command: ["sh", "-c", "while true; do sleep 60; done"]
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: scratch
    spec:
      nodeName: node01
      containers:
      - name: scratch
        image: busybox:1.36
        command: ["sleep", "3600"]
    EOF
tasks:
  - Stop new Pods from landing on `node01` and move every evictable Pod off it. The DaemonSet Pods stay; `scratch` may be deleted.
  - "Pretend the patch is done: write `patched` to `maintenance.log`."
  - Put `node01` back into service.
  - All 4 `web` replicas must be available at the end, and none of them on `node01` (Pods do not move back by themselves).
checks:
  - name: scratch is gone
    kind: Pod
    resource: scratch
    expect: absent
  - name: No web Pod runs on node01
    command: kubectl get pods -l app=web -o wide --no-headers | grep -c node01
    outputMatches: "^0"
  - name: web has 4 available replicas
    kind: Deployment
    resource: web
    path: .status.availableReplicas
    equals: 4
  - name: maintenance.log says patched
    command: cat maintenance.log
    outputMatches: patched
  - name: node01 is schedulable again
    command: kubectl get node node01 -o jsonpath='{.spec.unschedulable}'
    outputMatches: "^(false)?$"
hints:
  - "kubectl drain node01 cordons the node and evicts its Pods. Read the errors it prints: DaemonSet Pods and Pods without a controller need extra flags."
  - "kubectl drain node01 --ignore-daemonsets --force"
  - "kubectl uncordon node01 when the work is done."
solution:
  - kubectl drain node01 --ignore-daemonsets --force
  - echo patched > maintenance.log
  - kubectl uncordon node01
  - sleep 15
learned: |
  drain respects PodDisruptionBudgets: it evicts one Pod at a time and waits
  when another eviction would break the budget. Pods without a controller
  are lost for good, which is why drain refuses them without --force. To
  rebalance after uncordon, run kubectl rollout restart on the Deployment.
