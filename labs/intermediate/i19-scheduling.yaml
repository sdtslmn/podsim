id: i19-scheduling
title: Place Pods on the right nodes
level: intermediate
minutes: 12
tracks: [ckad, cka]
topic: Scheduling
intro: |
  The scheduler picks a node for every Pod. You steer it with:

  - `nodeSelector`: the node must have these labels
  - node affinity: richer rules, required or preferred
  - taints on nodes and tolerations on Pods: a taint keeps Pods away unless
    they tolerate it

  `node02` has the label `disk=ssd`. `node01` is reserved for batch work
  with the taint `workload=batch:NoSchedule`.
files:
  fast-db.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: fast-db
    spec:
      nodeSelector:
        disk: nvme
      containers:
      - name: redis
        image: redis:7
setup:
  - kubectl label node node02 disk=ssd
  - kubectl taint node node01 workload=batch:NoSchedule
  - kubectl apply -f fast-db.yaml
tasks:
  - The Pod `fast-db` stays Pending. Find out why and fix it so it runs on the node labeled `disk=ssd`. Its manifest is in `fast-db.yaml`.
  - Create a Pod named `report` (image `busybox:1.36`, command `sleep 3600`) that runs on `node01`. Use a nodeSelector on the label `kubernetes.io/hostname` and a toleration for the batch taint.
checks:
  - name: fast-db runs on node02
    kind: Pod
    resource: fast-db
    path: .spec.nodeName
    equals: node02
  - name: fast-db is Running
    kind: Pod
    resource: fast-db
    path: .status.phase
    equals: Running
  - name: report runs on node01
    kind: Pod
    resource: report
    path: .spec.nodeName
    equals: node01
  - name: report tolerates workload=batch
    kind: Pod
    resource: report
    path: .spec.tolerations[*].key
    contains: workload
hints:
  - "kubectl describe pod fast-db: the FailedScheduling event says the nodes didn't match the Pod's node affinity/selector."
  - "Change disk: nvme to disk: ssd in fast-db.yaml and kubectl replace --force -f fast-db.yaml"
  - "tolerations: - key: workload, operator: Equal, value: batch, effect: NoSchedule"
solution:
  - "sed -i 's/disk: nvme/disk: ssd/' fast-db.yaml"
  - kubectl replace --force -f fast-db.yaml
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: report
    spec:
      nodeSelector:
        kubernetes.io/hostname: node01
      tolerations:
      - key: workload
        operator: Equal
        value: batch
        effect: NoSchedule
      containers:
      - name: report
        image: busybox:1.36
        command: ["sleep", "3600"]
    EOF
  - sleep 10
learned: |
  A toleration only allows a Pod onto a tainted node; it does not attract it
  there. To dedicate nodes, combine a taint (keeps others away) with a
  nodeSelector or affinity (pulls the right Pods in).
