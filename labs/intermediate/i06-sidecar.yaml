id: i06-sidecar
title: Add a log shipping sidecar
level: intermediate
minutes: 10
tracks: [ckad]
topic: Multi-container Pods
intro: |
  The Pod `app` writes its log to a file instead of standard output, so
  `kubectl logs app` shows nothing useful. A sidecar container can follow
  the file and print it, so the log reaches the normal logging pipeline.

  Native sidecars are init containers with `restartPolicy: Always`: they
  start before the app and keep running next to it. The manifest of the
  current Pod is in `app.yaml`.
files:
  app.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
    spec:
      volumes:
      - name: logs
        emptyDir: {}
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo \"$(date) order processed\" >> /var/log/app.log; sleep 5; done"]
        volumeMounts:
        - name: logs
          mountPath: /var/log
setup:
  - kubectl apply -f app.yaml
tasks:
  - Add a native sidecar container named `log-shipper` to the Pod `app`, with the image `busybox:1.36` and the command `sh -c 'tail -F /var/log/app.log'`.
  - The sidecar mounts the volume `logs` at `/var/log`.
  - Keep the Pod name `app`. Most Pod fields cannot be changed in place, so you will have to recreate it.
checks:
  - name: log-shipper is a native sidecar
    kind: Pod
    resource: app
    path: .spec.initContainers[0].restartPolicy
    equals: Always
  - name: The sidecar is named log-shipper
    kind: Pod
    resource: app
    path: .spec.initContainers[0].name
    equals: log-shipper
  - name: Pod app is Running with both containers ready
    kind: Pod
    resource: app
    path: .status.containerStatuses[0].ready
    equals: true
  - name: kubectl logs app -c log-shipper shows the app log
    command: kubectl logs app -c log-shipper
    outputMatches: order processed
hints:
  - "Edit app.yaml: add initContainers with one entry that has restartPolicy: Always."
  - "kubectl replace --force -f app.yaml deletes the old Pod and creates the new one."
solution:
  - |
    cat <<EOF > app.yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
    spec:
      volumes:
      - name: logs
        emptyDir: {}
      initContainers:
      - name: log-shipper
        image: busybox:1.36
        restartPolicy: Always
        command: ["sh", "-c", "tail -F /var/log/app.log"]
        volumeMounts:
        - name: logs
          mountPath: /var/log
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo \"\$(date) order processed\" >> /var/log/app.log; sleep 5; done"]
        volumeMounts:
        - name: logs
          mountPath: /var/log
    EOF
  - kubectl replace --force -f app.yaml
  - sleep 20
learned: |
  A sidecar shares the Pod's volumes and network. Declared as an init
  container with restartPolicy Always, it starts first, is restarted if it
  stops, and does not keep a Job's Pod from completing. Older manifests put
  sidecars in containers, which also works for long-running Pods.
