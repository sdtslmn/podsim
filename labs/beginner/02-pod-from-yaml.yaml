id: 02-pod-from-yaml
title: Write a Pod manifest
level: beginner
minutes: 10
tracks: [kcna, ckad, cka]
topic: Pods
intro: |
  In real projects you describe objects in YAML files and apply them,
  so the files can live in Git. You rarely write a manifest from a blank
  page. Generate a starting point with a client-side dry run, save it to
  a file, adjust it, then apply it:

    kubectl run NAME --image=IMAGE --dry-run=client -o yaml > file.yaml

  You can edit the file in your own editor, or write the whole file with
  a heredoc (cat <<EOF > file.yaml ... EOF).
tasks:
  - Create a file named `api-pod.yaml` that describes a Pod named `api`.
  - The Pod runs the image `httpd:2.4`, exposes container port `80` and has the label `tier=backend`.
  - Create the Pod from the file with `kubectl apply -f api-pod.yaml`.
checks:
  - name: The file api-pod.yaml describes a Pod
    command: cat api-pod.yaml
    outputMatches: "kind:\\s*Pod"
  - name: Pod api exists
    kind: Pod
    resource: api
    expect: exists
  - name: Pod api runs httpd:2.4
    kind: Pod
    resource: api
    path: .spec.containers[0].image
    equals: httpd:2.4
  - name: Pod api exposes container port 80
    kind: Pod
    resource: api
    path: .spec.containers[0].ports[0].containerPort
    equals: 80
  - name: Pod api has the label tier=backend
    kind: Pod
    resource: api
    path: .metadata.labels.tier
    equals: backend
  - name: Pod api is Running
    kind: Pod
    resource: api
    path: .status.phase
    equals: Running
hints:
  - "Generate a template: kubectl run api --image=httpd:2.4 --port=80 --labels=tier=backend --dry-run=client -o yaml > api-pod.yaml"
  - "Then create it: kubectl apply -f api-pod.yaml. If you change the file later, apply it again."
solution:
  - kubectl run api --image=httpd:2.4 --port=80 --labels=tier=backend --dry-run=client -o yaml > api-pod.yaml
  - kubectl apply -f api-pod.yaml
learned: |
  --dry-run=client -o yaml prints the object without creating it. This is the
  fastest way to get a correct manifest, and it is allowed in the CKA and CKAD
  exams. Labels such as tier=backend are how Services and Deployments find Pods.
