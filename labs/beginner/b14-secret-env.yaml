id: b14-secret-env
title: Keep a password in a Secret
level: beginner
minutes: 10
tracks: [kcna, ckad]
topic: Configuration
intro: |
  Secrets hold sensitive values such as passwords and tokens. They work like
  ConfigMaps, but their values are stored base64 encoded and access to them
  can be restricted separately.

  Base64 is an encoding, not encryption: anyone who can read the Secret can
  decode it with `base64 -d`.
setup:
  - kubectl create secret generic legacy-token --from-literal=token=tk-7d1f42
tasks:
  - Create a generic Secret named `db-pass` with the key `password` set to `Sup3rS3cret`.
  - Create a Pod named `db-client` (image `busybox:1.36`, command `sleep 3600`) with an environment variable `DB_PASSWORD` taken from the key `password` of `db-pass`.
  - Decode the key `token` of the existing Secret `legacy-token` and write the plain value to `token.txt`.
checks:
  - name: Secret db-pass has the password
    kind: Secret
    resource: db-pass
    path: .data.password
    equals: U3VwM3JTM2NyZXQ=
  - name: DB_PASSWORD comes from the Secret
    kind: Pod
    resource: db-client
    path: .spec.containers[0].env[0].valueFrom.secretKeyRef.name
    equals: db-pass
  - name: The Pod sees the password
    command: kubectl exec db-client -- printenv DB_PASSWORD
    outputMatches: "^Sup3rS3cret"
  - name: token.txt has the decoded token
    command: cat token.txt
    outputMatches: "^\\s*tk-7d1f42\\s*$"
hints:
  - "kubectl create secret generic db-pass --from-literal=password=Sup3rS3cret"
  - "In the Pod: env: - name: DB_PASSWORD, valueFrom: secretKeyRef: name: db-pass, key: password"
  - "kubectl get secret legacy-token -o jsonpath='{.data.token}' | base64 -d > token.txt"
solution:
  - kubectl create secret generic db-pass --from-literal=password=Sup3rS3cret
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: db-client
    spec:
      containers:
      - name: db-client
        image: busybox:1.36
        command: ["sleep", "3600"]
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-pass
              key: password
    EOF
  - kubectl get secret legacy-token -o jsonpath='{.data.token}' | base64 -d > token.txt
  - sleep 10
learned: |
  kubectl create secret generic encodes the values for you. If you write a
  Secret manifest by hand, put plain text under stringData or base64 values
  under data. Restrict who can get secrets with RBAC.
