id: i09-config-secrets
title: Configure a Pod with a ConfigMap and a Secret
level: intermediate
minutes: 10
tracks: [ckad]
topic: Storage and configuration
intro: |
  Configuration lives outside the image. ConfigMaps hold plain settings and
  Secrets hold credentials. Pods consume them as environment variables or
  as files in a volume.
tasks:
  - Create a ConfigMap named `app-config` with the keys `MODE=production` and `LOG_LEVEL=info`.
  - Create a generic Secret named `db-creds` with `username=app` and `password=s3cr3t`.
  - Create a Pod named `app` (image `busybox:1.36`, command `sleep 3600`) that gets every key of `app-config` as environment variables and mounts `db-creds` read-only at `/etc/creds`.
checks:
  - name: ConfigMap app-config has MODE=production
    kind: ConfigMap
    resource: app-config
    path: .data.MODE
    equals: production
  - name: Secret db-creds has a password
    kind: Secret
    resource: db-creds
    path: .data.password
    equals: czNjcjN0
  - name: The Pod sees MODE as an environment variable
    command: kubectl exec app -- printenv MODE
    outputMatches: "^production"
  - name: The password is a file in /etc/creds
    command: kubectl exec app -- cat /etc/creds/password
    outputMatches: "^s3cr3t"
  - name: The secret volume is mounted read-only
    kind: Pod
    resource: app
    path: .spec.containers[0].volumeMounts[0].readOnly
    equals: true
hints:
  - "kubectl create configmap app-config --from-literal=MODE=production --from-literal=LOG_LEVEL=info"
  - "kubectl create secret generic db-creds --from-literal=username=app --from-literal=password=s3cr3t"
  - "In the Pod: envFrom: [{configMapRef: {name: app-config}}], a volume with secret.secretName: db-creds and a volumeMount with readOnly: true."
solution:
  - kubectl create configmap app-config --from-literal=MODE=production --from-literal=LOG_LEVEL=info
  - kubectl create secret generic db-creds --from-literal=username=app --from-literal=password=s3cr3t
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
    spec:
      volumes:
      - name: creds
        secret:
          secretName: db-creds
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
    EOF
  - sleep 10
learned: |
  Environment variables are read once at start; files in a ConfigMap or
  Secret volume are updated in place a while after the object changes
  (except with subPath). Secret values are base64 encoded, not encrypted.
