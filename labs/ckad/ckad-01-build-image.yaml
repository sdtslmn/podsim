id: ckad-01-build-image
title: Build, push and run a container image
level: intermediate
minutes: 10
tracks: [ckad]
topic: Application Design and Build
intro: |
  Your work folder has a small app: a `Dockerfile` and a `message.txt`.
  Developers build images like this with docker or podman, push them to a
  registry, and then reference the image in a Pod.

  The cluster pulls from the registry `localhost:5000`. Images that only
  exist on your machine cannot be pulled by the nodes.
files:
  Dockerfile: |
    FROM busybox:1.36
    COPY message.txt /message.txt
    CMD ["sh", "-c", "cat /message.txt && sleep 3600"]
  message.txt: |
    greetings from a custom image
tasks:
  - Build an image from the work folder and tag it `localhost:5000/greeter:1.0`. docker and podman both work.
  - Push the image to the registry.
  - Save the image as an archive named `greeter.tar` in the work folder.
  - Run a Pod named `greeter` with the image `localhost:5000/greeter:1.0`.
checks:
  - name: The archive greeter.tar exists
    command: ls greeter.tar
    exitCode: 0
  - name: Pod greeter uses localhost:5000/greeter:1.0
    kind: Pod
    resource: greeter
    path: .spec.containers[0].image
    equals: localhost:5000/greeter:1.0
  - name: Pod greeter is Running
    kind: Pod
    resource: greeter
    path: .status.phase
    equals: Running
  - name: The Pod prints the message from the image
    command: kubectl logs greeter
    outputMatches: greetings from a custom image
hints:
  - "podman build -t NAME:TAG DIRECTORY builds from the Dockerfile in DIRECTORY. The work folder is ."
  - "podman push localhost:5000/greeter:1.0, then podman save -o greeter.tar localhost:5000/greeter:1.0"
  - "kubectl run greeter --image=localhost:5000/greeter:1.0"
solution:
  - podman build -t localhost:5000/greeter:1.0 .
  - podman push localhost:5000/greeter:1.0
  - podman save -o greeter.tar localhost:5000/greeter:1.0
  - kubectl run greeter --image=localhost:5000/greeter:1.0
learned: |
  An image name carries its registry: localhost:5000/greeter:1.0 is pulled
  from localhost:5000. Pods only see images that were pushed to a registry
  the nodes can reach. docker save and podman save write an archive you can
  move to another machine and load with docker load or podman load.
