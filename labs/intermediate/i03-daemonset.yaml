id: i03-daemonset
title: Run an agent on every node with a DaemonSet
level: intermediate
minutes: 10
tracks: [ckad, cka]
topic: Workloads
intro: |
  A DaemonSet runs one copy of a Pod on every node (or every node that
  matches a selector). Log collectors, monitoring agents and network plugins
  are typical DaemonSets.

  The control plane node has the taint
  `node-role.kubernetes.io/control-plane:NoSchedule`, so a DaemonSet only
  lands there if its Pods tolerate that taint.
setup:
  - kubectl create namespace monitoring
tasks:
  - Create a DaemonSet named `log-agent` in the namespace `monitoring` with the image `busybox:1.36` and the command `sh -c 'while true; do echo collecting; sleep 30; done'`.
  - Its Pods carry the label `app=log-agent`.
  - Make sure it also runs on the control plane node, so there is one Pod on each of the 3 nodes.
checks:
  - name: DaemonSet log-agent schedules 3 Pods
    kind: DaemonSet
    namespace: monitoring
    resource: log-agent
    path: .status.desiredNumberScheduled
    equals: 3
  - name: All 3 Pods are ready
    kind: DaemonSet
    namespace: monitoring
    resource: log-agent
    path: .status.numberReady
    equals: 3
  - name: The Pods tolerate the control plane taint
    kind: DaemonSet
    namespace: monitoring
    resource: log-agent
    path: .spec.template.spec.tolerations[*].key
    contains: node-role.kubernetes.io/control-plane
hints:
  - "There is no kubectl create daemonset. Generate a Deployment with --dry-run=client -o yaml, change kind to DaemonSet and remove replicas and strategy."
  - "Add tolerations: - key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule"
solution:
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: log-agent
      namespace: monitoring
    spec:
      selector:
        matchLabels:
          app: log-agent
      template:
        metadata:
          labels:
            app: log-agent
        spec:
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          containers:
          - name: agent
            image: busybox:1.36
            command: ["sh", "-c", "while true; do echo collecting; sleep 30; done"]
    EOF
  - sleep 15
learned: |
  A DaemonSet has no replicas field: the node count decides. When a node
  joins, it gets a Pod; when it leaves, the Pod goes too. kubectl drain
  needs --ignore-daemonsets because those Pods would come straight back.
