id: i01-job-parallel
title: Run a batch Job in parallel
level: intermediate
minutes: 8
tracks: [ckad]
topic: Workloads
intro: |
  A Job runs Pods until a number of them succeed. `completions` sets how
  many successful Pods are needed and `parallelism` how many run at the
  same time. `backoffLimit` is how many failures are tolerated before the
  Job gives up.
tasks:
  - Create a Job named `render` with the image `busybox:1.36` and the command `sh -c 'echo rendering frame; sleep 5'`.
  - It needs 6 successful completions, running 2 Pods at a time, and must give up after 3 failures.
  - Wait until the Job is complete.
checks:
  - name: Job render needs 6 completions
    kind: Job
    resource: render
    path: .spec.completions
    equals: 6
  - name: Job render runs 2 Pods at a time
    kind: Job
    resource: render
    path: .spec.parallelism
    equals: 2
  - name: backoffLimit is 3
    kind: Job
    resource: render
    path: .spec.backoffLimit
    equals: 3
  - name: All 6 Pods succeeded
    kind: Job
    resource: render
    path: .status.succeeded
    equals: 6
hints:
  - "kubectl create job render --image=busybox:1.36 --dry-run=client -o yaml -- sh -c 'echo rendering frame; sleep 5' > job.yaml"
  - "Add completions, parallelism and backoffLimit under spec (not under the Pod template), then kubectl apply -f job.yaml."
  - "kubectl wait --for=condition=complete job/render --timeout=120s"
solution:
  - |
    cat <<EOF > job.yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: render
    spec:
      completions: 6
      parallelism: 2
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: render
            image: busybox:1.36
            command: ["sh", "-c", "echo rendering frame; sleep 5"]
    EOF
  - kubectl apply -f job.yaml
  - kubectl wait --for=condition=complete job/render --timeout=120s
learned: |
  With completions 6 and parallelism 2 the Job runs three waves of two Pods.
  A Job's Pod template must use restartPolicy Never or OnFailure, and most
  of the Job spec is immutable: change it by deleting and recreating the Job.
