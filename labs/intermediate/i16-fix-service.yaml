id: i16-fix-service
title: Fix a Service that reaches nothing
level: intermediate
minutes: 10
tracks: [ckad]
topic: Networking
intro: |
  The Deployment `orders` is running, but requests to the Service `orders`
  time out. A Service needs two things to be right: a selector that matches
  the Pod labels, and a targetPort the containers listen on.
setup:
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: orders
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: orders
      template:
        metadata:
          labels:
            app: orders
        spec:
          containers:
          - name: orders
            image: hashicorp/http-echo:1.0
            args: ["-text=orders ok", "-listen=:5678"]
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: orders
    spec:
      selector:
        app: order
      ports:
      - port: 80
        targetPort: 8080
    EOF
tasks:
  - Find out why the Service `orders` has no working endpoints.
  - Fix the Service so that `http://orders` returns `orders ok` from inside the cluster. Do not change the Deployment.
  - Also expose the Deployment on every node at NodePort 30090 with a new Service named `orders-ext` (port 80).
checks:
  - name: The Service selects app=orders
    kind: Service
    resource: orders
    path: .spec.selector.app
    equals: orders
  - name: http://orders answers
    command: kubectl run lab-check --rm -i --image=busybox:1.36 --restart=Never -- wget -qO- -T 2 http://orders
    outputMatches: orders ok
  - name: orders-ext is a NodePort on 30090
    kind: Service
    resource: orders-ext
    path: .spec.ports[0].nodePort
    equals: 30090
  - name: The node port answers
    command: curl -s http://node01:30090
    outputMatches: orders ok
hints:
  - "kubectl get endpoints orders shows nothing; compare kubectl get svc orders -o yaml with the Pod labels (kubectl get pods --show-labels)."
  - "The container listens on 5678. Fix selector and targetPort with kubectl edit or kubectl patch."
  - "kubectl expose deployment orders --name=orders-ext --type=NodePort --port=80 --target-port=5678 --dry-run=client -o yaml, then set nodePort: 30090."
solution:
  - "kubectl patch service orders -p '{\"spec\":{\"selector\":{\"app\":\"orders\"},\"ports\":[{\"port\":80,\"targetPort\":5678}]}}'"
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Service
    metadata:
      name: orders-ext
    spec:
      type: NodePort
      selector:
        app: orders
      ports:
      - port: 80
        targetPort: 5678
        nodePort: 30090
    EOF
learned: |
  kubectl get endpoints (or endpointslices) is the quickest Service check:
  no addresses means the selector matches no ready Pods; addresses with
  failing requests usually means a wrong targetPort.
