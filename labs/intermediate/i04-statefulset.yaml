id: i04-statefulset
title: Give each replica a stable identity
level: intermediate
minutes: 12
tracks: [ckad, cka]
topic: Workloads
intro: |
  A StatefulSet creates Pods with fixed names (`db-0`, `db-1`, ...), starts
  them in order and gives each one its own PersistentVolumeClaim. Together
  with a headless Service (clusterIP None) each Pod also gets a stable DNS
  name: `db-0.db.NAMESPACE.svc.cluster.local`.

  Databases and other clustered systems need this, because each member has
  its own data and peers find each other by name.
tasks:
  - Create a headless Service named `db` (clusterIP `None`) on port 6379 that selects `app=db`.
  - Create a StatefulSet named `db` with 3 replicas, `serviceName` `db`, Pod label `app=db` and the image `redis:7`.
  - Each replica gets its own 1Gi PersistentVolumeClaim from a volumeClaimTemplate named `data` (storage class `standard`), mounted at `/data`.
checks:
  - name: Service db is headless
    kind: Service
    resource: db
    path: .spec.clusterIP
    equals: None
  - name: StatefulSet db has 3 ready replicas
    kind: StatefulSet
    resource: db
    path: .status.readyReplicas
    equals: 3
  - name: Replica 1 has its own claim
    kind: PersistentVolumeClaim
    resource: data-db-1
    path: .status.phase
    equals: Bound
  - name: db-2.db resolves in DNS
    command: kubectl run lab-check --rm -i --image=busybox:1.36 --restart=Never -- nslookup db-2.db
    outputMatches: "Name:\\s+db-2\\.db"
hints:
  - "kubectl create service clusterip db --clusterip=None --tcp=6379:6379 creates the headless Service (then check its selector)."
  - "The StatefulSet manifest looks like a Deployment plus serviceName and volumeClaimTemplates."
solution:
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Service
    metadata:
      name: db
    spec:
      clusterIP: None
      selector:
        app: db
      ports:
      - port: 6379
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: db
    spec:
      serviceName: db
      replicas: 3
      selector:
        matchLabels:
          app: db
      template:
        metadata:
          labels:
            app: db
        spec:
          containers:
          - name: redis
            image: redis:7
            volumeMounts:
            - name: data
              mountPath: /data
      volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: standard
          resources:
            requests:
              storage: 1Gi
    EOF
  - sleep 60
learned: |
  Delete db-1 and the StatefulSet recreates a Pod with the same name, the
  same DNS name and the same claim data-db-1, so its data survives. Scaling
  down removes the highest ordinal first and keeps the claims.
