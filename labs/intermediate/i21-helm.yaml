id: i21-helm
title: Deploy and upgrade a Helm chart
level: intermediate
minutes: 10
tracks: [ckad]
topic: Packaging and updates
intro: |
  Helm installs packaged applications (charts) from repositories. Values
  customize a release, and every install or upgrade is a revision you can
  roll back to.

  The Bitnami repository is at https://charts.bitnami.com/bitnami.
tasks:
  - Add the Bitnami repository under the name `bitnami`.
  - Install the chart `bitnami/nginx` as the release `web` in a new namespace `frontend`, with 2 replicas and a ClusterIP Service (values `replicaCount` and `service.type`).
  - Upgrade the release to 3 replicas, keeping the other values.
checks:
  - name: Release web is deployed in frontend
    command: helm ls -n frontend
    outputMatches: "web\\s+frontend\\s+2\\s+.*deployed"
  - name: The Deployment runs 3 ready replicas
    kind: Deployment
    namespace: frontend
    resource: web-nginx
    path: .status.readyReplicas
    equals: 3
  - name: The Service is ClusterIP
    kind: Service
    namespace: frontend
    resource: web-nginx
    path: .spec.type
    equals: ClusterIP
hints:
  - "helm repo add bitnami https://charts.bitnami.com/bitnami, then helm search repo nginx"
  - "helm install web bitnami/nginx -n frontend --create-namespace --set replicaCount=2 --set service.type=ClusterIP"
  - "helm upgrade web bitnami/nginx -n frontend --reuse-values --set replicaCount=3"
solution:
  - helm repo add bitnami https://charts.bitnami.com/bitnami
  - helm install web bitnami/nginx -n frontend --create-namespace --set replicaCount=2 --set service.type=ClusterIP
  - helm upgrade web bitnami/nginx -n frontend --reuse-values --set replicaCount=3
  - sleep 15
learned: |
  helm show values CHART lists what you can set. Without --reuse-values an
  upgrade starts again from the chart defaults plus what you pass on that
  command. helm history and helm rollback work like kubectl rollout.
