id: ckad-16-top
title: Find the Pod that uses the most CPU
level: intermediate
minutes: 6
tracks: [ckad]
topic: Application Observability and Maintenance
intro: |
  The cluster runs metrics-server, so `kubectl top` shows current CPU and
  memory use of Pods and nodes. Several Pods run in the namespace `batch`
  and one of them is burning CPU.
setup:
  - kubectl create namespace batch
  - kubectl run reporter -n batch --image=busybox:1.36 -- sh -c 'while true; do echo report; sleep 10; done'
  - kubectl run cruncher -n batch --image=polinux/stress -- stress --cpu 1
  - kubectl run indexer -n batch --image=nginx:1.29
settle: 30
tasks:
  - Find the Pod in the namespace `batch` that uses the most CPU.
  - Write its name, and nothing else, to the file `high-cpu.txt` in your work folder.
checks:
  - name: high-cpu.txt names the busiest Pod
    command: cat high-cpu.txt
    outputMatches: "^cruncher\\s*$"
hints:
  - "kubectl top pod -n batch --sort-by=cpu"
  - "kubectl top pod -n batch --sort-by=cpu --no-headers | head -1 | awk '{print $1}' > high-cpu.txt"
solution:
  - kubectl top pod -n batch --sort-by=cpu --no-headers | head -1 | awk '{print $1}' > high-cpu.txt
learned: |
  kubectl top pod and kubectl top node need metrics-server. Use --containers
  to see each container, and --sort-by=cpu or --sort-by=memory to rank.
  The numbers are recent samples, not limits.
