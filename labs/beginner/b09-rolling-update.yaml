id: b09-rolling-update
title: Roll out a new version
level: beginner
minutes: 10
tracks: [ckad, cka]
topic: Deployments
intro: |
  The Deployment `blog` runs nginx:1.25 with 3 replicas. You need to
  upgrade it to nginx:1.27 without downtime.

  When the Pod template changes, the Deployment creates a new ReplicaSet
  and moves Pods over a few at a time (a rolling update). The old
  ReplicaSet is kept with 0 replicas so you can roll back later.
setup:
  - kubectl create deployment blog --image=nginx:1.25 --replicas=3
tasks:
  - Update the container image of the Deployment `blog` to `nginx:1.27`.
  - Follow the rollout until it finishes.
  - Look at the rollout history and at the two ReplicaSets.
checks:
  - name: The Pod template uses nginx:1.27
    kind: Deployment
    resource: blog
    path: .spec.template.spec.containers[0].image
    equals: nginx:1.27
  - name: All 3 replicas run the new version
    kind: Deployment
    resource: blog
    path: .status.updatedReplicas
    equals: 3
  - name: All 3 replicas are ready
    kind: Deployment
    resource: blog
    path: .status.readyReplicas
    equals: 3
  - name: The Deployment is on revision 2
    kind: Deployment
    resource: blog
    path: .metadata.annotations['deployment.kubernetes.io/revision']
    equals: "2"
hints:
  - "kubectl set image changes a container's image. You need the container name: check it with kubectl describe deployment blog."
  - "kubectl set image deployment/blog nginx=nginx:1.27"
  - "Follow it with kubectl rollout status deployment/blog, then kubectl rollout history deployment/blog"
solution:
  - kubectl set image deployment/blog nginx=nginx:1.27
  - kubectl rollout status deployment/blog
learned: |
  The CHANGE-CAUSE column in rollout history is empty unless you set the
  kubernetes.io/change-cause annotation, for example:
    kubectl annotate deployment blog kubernetes.io/change-cause="upgrade to 1.27"
  Writing why you changed something makes rollbacks much easier.
