id: i15-security-context
title: Lock down a Pod with a security context
level: intermediate
minutes: 10
tracks: [ckad]
topic: Access and security
intro: |
  A security context sets the user and group a container runs as, Linux
  capabilities, privilege escalation and a read-only root filesystem.
  Pod-level settings apply to all containers; container-level settings
  override them.
tasks:
  - Create a Pod named `secure` with the image `busybox:1.36` and the command `sleep 3600`.
  - At the Pod level, run as user 1000 and group 3000, with fsGroup 2000.
  - At the container level, forbid privilege escalation, drop all capabilities and make the root filesystem read-only.
checks:
  - name: The Pod runs as user 1000
    kind: Pod
    resource: secure
    path: .spec.securityContext.runAsUser
    equals: 1000
  - name: The Pod runs as group 3000
    kind: Pod
    resource: secure
    path: .spec.securityContext.runAsGroup
    equals: 3000
  - name: fsGroup is 2000
    kind: Pod
    resource: secure
    path: .spec.securityContext.fsGroup
    equals: 2000
  - name: Privilege escalation is not allowed
    kind: Pod
    resource: secure
    path: .spec.containers[0].securityContext.allowPrivilegeEscalation
    equals: false
  - name: All capabilities are dropped
    kind: Pod
    resource: secure
    path: .spec.containers[0].securityContext.capabilities.drop
    contains: ALL
  - name: The root filesystem is read-only
    command: kubectl exec secure -- touch /test.txt
    outputMatches: Read-only file system
  - name: id shows uid 1000
    command: kubectl exec secure -- id
    outputMatches: uid=1000 gid=3000
hints:
  - "kubectl explain pod.spec.securityContext and kubectl explain pod.spec.containers.securityContext show where each field goes."
  - "runAsUser, runAsGroup and fsGroup go under spec.securityContext; allowPrivilegeEscalation, capabilities and readOnlyRootFilesystem under the container's securityContext."
solution:
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
      - name: secure
        image: busybox:1.36
        command: ["sleep", "3600"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    EOF
  - sleep 10
learned: |
  These settings are what the restricted Pod Security Standard asks for
  (plus runAsNonRoot and a seccomp profile). Apps that need to write should
  get an emptyDir mounted where they write, rather than a writable root.
