id: ckad-24-ingress
title: Route HTTP traffic with an Ingress
level: intermediate
minutes: 12
tracks: [ckad]
topic: Services and Networking
intro: |
  An Ingress routes HTTP requests by host and path to Services. The
  ingress-nginx controller runs in this cluster with the IngressClass
  `nginx`, and listens on NodePort 30080 of every node.

  The Services `web` (port 80) and `api` (port 8080) already exist.
setup:
  - kubectl create deployment web --image=hashicorp/http-echo:1.0 -- /http-echo -text=storefront -listen=:5678
  - kubectl expose deployment web --port=80 --target-port=5678
  - kubectl create deployment api --image=hashicorp/http-echo:1.0 -- /http-echo -text=api -listen=:8080
  - kubectl expose deployment api --port=8080
tasks:
  - Create an Ingress named `shop` with the class `nginx` for the host `shop.example.com`.
  - Requests to `/api` (prefix) go to the Service `api` on port 8080; everything else (`/`, prefix) goes to `web` on port 80.
checks:
  - name: Ingress shop uses the class nginx
    kind: Ingress
    resource: shop
    path: .spec.ingressClassName
    equals: nginx
  - name: The rule is for shop.example.com
    kind: Ingress
    resource: shop
    path: .spec.rules[0].host
    equals: shop.example.com
  - name: /api reaches the api Service
    command: "curl -s -H 'Host: shop.example.com' http://node01:30080/api/orders"
    outputMatches: "^api"
  - name: / reaches the web Service
    command: "curl -s -H 'Host: shop.example.com' http://node01:30080/"
    outputMatches: storefront
hints:
  - "kubectl create ingress shop --class=nginx --rule='shop.example.com/api*=api:8080' --rule='shop.example.com/*=web:80'"
  - "Test with curl -H 'Host: shop.example.com' http://node01:30080/api"
solution:
  - kubectl create ingress shop --class=nginx --rule='shop.example.com/api*=api:8080' --rule='shop.example.com/*=web:80'
  - sleep 10
learned: |
  With pathType Prefix, /api matches /api and /api/orders but not /apis.
  The most specific (longest) path wins. Without ingressClassName the
  default IngressClass is used, if the cluster has one.
