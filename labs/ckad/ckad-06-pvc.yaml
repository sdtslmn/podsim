id: ckad-06-pvc
title: Keep data in a PersistentVolumeClaim
level: intermediate
minutes: 8
tracks: [ckad]
topic: Application Design and Build
intro: |
  A PersistentVolumeClaim asks for storage. The cluster's default
  StorageClass `standard` provisions a PersistentVolume for it, and Pods
  mount the claim by name. Data in the volume outlives the Pod.
tasks:
  - Create a PersistentVolumeClaim named `data` that requests `1Gi` with access mode `ReadWriteOnce` and the storage class `standard`.
  - Create a Pod named `writer` (image `busybox:1.36`) that mounts the claim at `/data` and runs `sh -c 'echo saved > /data/state.txt; sleep 3600'`.
checks:
  - name: PVC data is Bound
    kind: PersistentVolumeClaim
    resource: data
    path: .status.phase
    equals: Bound
  - name: PVC data requests 1Gi
    kind: PersistentVolumeClaim
    resource: data
    path: .spec.resources.requests.storage
    equals: 1Gi
  - name: Pod writer mounts the claim data
    kind: Pod
    resource: writer
    path: .spec.volumes[*].persistentVolumeClaim.claimName
    contains: data
  - name: The file is on the volume
    command: kubectl exec writer -- cat /data/state.txt
    outputMatches: saved
hints:
  - "The Kubernetes docs page 'Configure a Pod to Use a PersistentVolume for Storage' has both manifests."
  - "In the Pod: volumes: - name: data, persistentVolumeClaim: claimName: data. Then a volumeMount with mountPath /data."
solution:
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: writer
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      containers:
      - name: writer
        image: busybox:1.36
        command: ["sh", "-c", "echo saved > /data/state.txt; sleep 3600"]
        volumeMounts:
        - name: data
          mountPath: /data
    EOF
  - sleep 10
learned: |
  The claim asks, the StorageClass provisions, the PersistentVolume holds the
  data. Delete the Pod and start another with the same claim: the file is
  still there. With reclaimPolicy Delete, deleting the claim deletes the data.
